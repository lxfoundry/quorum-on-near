[package]
name = "quorum-pools"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pools escrow: threshold group purchases with an escrowed refund bonus"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
anyhow = "1.0.104"
near-sdk = { version = "5", features = ["unit-testing"] }
quorum-sandbox-support = { path = "../../crates/sandbox-support" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
