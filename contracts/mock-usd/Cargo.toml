[package]
name = "mock-usd"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mock USD (mUSD): a NEP-141 token for sandbox tests, with a capped open mint"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-contract-standards = "5"
near-sdk = "5"

[dev-dependencies]
anyhow = "1.0.104"
near-sdk = { version = "5", features = ["unit-testing"] }
quorum-sandbox-support = { path = "../../crates/sandbox-support" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
