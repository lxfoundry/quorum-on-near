name: CI

# Runs every test suite on pull requests into main and on every push to main (a merged PR).
# Docs-only changes skip it.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

# A new push to a pull request cancels that PR's earlier run. Runs on main are never cancelled, so
# each merge is tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repository or needs a secret: the tests use local sandboxes only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned: cargo-near 0.23.0 is the version the sandbox tests were run with.
  CARGO_NEAR_VERSION: "0.23.0"

# The sandbox node (nearcore 2.13.4) needs glibc 2.38 or later, so the runner is pinned to
# Ubuntu 24.04 instead of `ubuntu-latest`.
jobs:
  typescript:
    name: TypeScript (typecheck, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      # Keep in step with "engines" in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  rust-lint:
    name: Rust (fmt, clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain, components and targets named in rust-toolchain.toml.
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust (unit and sandbox tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The sandbox tests build the contracts through the `cargo near` CLI.
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
      - run: cargo near --version
      - run: cargo test --locked --workspace

  gateway-sandbox:
    name: Gateway (sandbox test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
      - run: cargo near --version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the contracts
        run: |
          cargo near build non-reproducible-wasm --no-abi --no-embed-abi --manifest-path contracts/mock-usd/Cargo.toml
          cargo near build non-reproducible-wasm --no-abi --no-embed-abi --manifest-path contracts/pools/Cargo.toml
      - name: Run the gateway against the sandbox
        env:
          QUORUM_MOCK_USD_WASM: ${{ github.workspace }}/target/near/mock_usd/mock_usd.wasm
          QUORUM_POOLS_WASM: ${{ github.workspace }}/target/near/quorum_pools/quorum_pools.wasm
        run: pnpm --filter @quorum-on-near/gateway test:sandbox
